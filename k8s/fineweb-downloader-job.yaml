apiVersion: batch/v1
kind: Job
metadata:
  name: fineweb-downloader
  namespace: ucsdfutures
spec:
  template:
    spec:
      containers:
      - name: downloader
        image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          pip install huggingface_hub tqdm
          python3 -c '
          import os
          from huggingface_hub import snapshot_download
          
          DATA_DIR = "/data"
          
          # 1. FineWeb-Edu (High Quality Web)
          print("Downloading FineWeb-Edu...")
          # Sample (50GB)
          snapshot_download(repo_id="HuggingFaceFW/fineweb-edu", repo_type="dataset", allow_patterns="sample/100BT/*", local_dir=f"{DATA_DIR}/fineweb-edu", max_workers=16)
          # Main Dump (Partial - 2TB target)
          try:
              snapshot_download(repo_id="HuggingFaceFW/fineweb-edu", repo_type="dataset", allow_patterns="data/CC-MAIN-2024-10/*", local_dir=f"{DATA_DIR}/fineweb-edu", max_workers=16)
          except Exception as e:
              print(f"FineWeb-Edu download partial error (might be space or net): {e}")

          # 2. FinePDFs (Academic/Long Context)
          print("Downloading FinePDFs...")
          # English subset (~1.2TB)
          try:
              snapshot_download(repo_id="HuggingFaceFW/finepdfs", repo_type="dataset", allow_patterns="data/eng_Latn/*", local_dir=f"{DATA_DIR}/finepdfs", max_workers=16)
          except Exception as e:
              print(f"FinePDFs download error: {e}")
              
          print("Done! Data cached to PVC.")
          '
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            ephemeral-storage: "100Gi"
          limits:
            cpu: "8"
            memory: "32Gi"
            ephemeral-storage: "200Gi"
      restartPolicy: OnFailure
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pure-transformer-data
